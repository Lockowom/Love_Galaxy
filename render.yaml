services:
  - type: web
    name: love-galaxy
    env: static
    # Sella ?v=<buildId> en index.html antes de publicar (cache-busting automático).
    buildCommand: node scripts/stamp-version.js
    staticPublishPath: .
    headers:
      # --- Seguridad (todas las rutas) ---
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        # 'wasm-unsafe-eval' es necesario para compilar/instanciar el juego en WebAssembly.
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; base-uri 'self'"
      # --- HTML: nunca cachear (siempre se revalida, evita quedarse pegado) ---
      - path: /
        name: Cache-Control
        value: no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-store, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: no-store, must-revalidate
      # --- Assets versionados con ?v=: caché larga e inmutable ---
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # El .wasm del juego se descarga con ?v=<buildId>, así que es cacheable.
      - path: /*.wasm
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.wasm
        name: Content-Type
        value: application/wasm
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # NOTA: healthCheckPath es propio de web services; en static sites Render suele
    # ignorarlo (la raíz responde 200). Si el deploy fallara por validación, elimina
    # esta línea — no es funcionalmente necesaria para un sitio estático.
    healthCheckPath: /
